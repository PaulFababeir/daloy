<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Daloy Dual-Flow Gradient (Teal to Sky to Crimson) -->
    <linearGradient id="daloyFlow" x1="28" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="flowGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- River Topographic Wave Lines (Subtle Background) -->
  <path d="M 24 78 Q 44 68 64 76 T 104 70" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 24 90 Q 44 80 64 88 T 104 82" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- DALOY "D" Stream & Pulse Icon (Continuous flow vector) -->
  <!-- Left stable baseline -->
  <line x1="38" y1="34" x2="38" y2="94" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" />

  <!-- Flowing Curve looping into forward predictive arc -->
  <path d="M 38 34 C 74 32, 98 48, 92 72 C 86 90, 64 94, 38 94" 
        stroke="url(#daloyFlow)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#flowGlow)" />

  <!-- Inner Dynamic Surge Wave (The epidemic wave inside the flow) -->
  <path d="M 49 68 Q 58 54 68 62 T 80 50" 
        stroke="#E11D48" 
        stroke-width="3" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Apex Early-Warning Pulse Point -->
  <circle cx="80" cy="50" r="3.5" fill="#FFF" />
  <circle cx="80" cy="50" r="6.5" stroke="#E11D48" stroke-width="1.5" opacity="0.75" />
</svg>
